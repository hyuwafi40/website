<form method="post" class="field-container field-fade-in">
    {% csrf_token %}
    <div class="field-header">
        <div>
            <h2 class="field-title">Edit School</h2>
            <p class="field-subtitle">Perbarui informasi sekolah</p>
        </div>
    </div>
    <div class="field-card">
        <div class="field-section-header">
            <div class="field-section-icon">
                <i class="fa-solid fa-school"></i>
            </div>
            <div>
                <h3 class="field-section-title">Informasi Sekolah</h3>
                <p class="field-section-desc">Data lengkap sekolah</p>
            </div>
        </div>
        <div class="field-form-grid">
            {% for field in form %}
                <div class="field-form-group{% if field.name == 'address' or field.name == 'vision' or field.name == 'mission' or field.name == 'goals' %} full{% endif %}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="field-help">{{ field.help_text }}</span>
                    {% endif %}
                    {% if field.errors %}
                        <div class="field-error">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
    <div class="field-actions">
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Simpan</button>
        <a href="{% url 'core:school' %}" class="btn btn-secondary">Batal</a>
    </div>
</form>
