<div class="modal-backdrop" id="advertisementModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="advertisementModalTitle">Buat Iklan</h2>
            <button type="button" class="btn-icon" data-close-modal>
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <form method="post"
                  action="{% url 'core:advertisement_create' %}"
                  data-create-url="{% url 'core:advertisement_create' %}"
                  id="advertisementForm">
                {% csrf_token %}
                <div class="input-group">
                    <label for="{{ form.type.id_for_label }}">{{ form.type.label }}</label>
                    {{ form.type }}
                    <div class="field-error" id="advertisementFormError"></div>
                </div>
                <div class="input-group">
                    <label for="{{ form.image.id_for_label }}">{{ form.image.label }}</label>
                    {{ form.image }}
                </div>
                <div class="input-group">
                    <label for="{{ form.link.id_for_label }}">{{ form.link.label }}</label>
                    {{ form.link }}
                </div>
                <div class="input-group">
                    <label for="{{ form.enddate.id_for_label }}">{{ form.enddate.label }}</label>
                    {{ form.enddate }}
                </div>
                <div class="input-group">
                    <label for="{{ form.status.id_for_label }}">{{ form.status.label }}</label>
                    {{ form.status }}
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Simpan
                    </button>
                    <button type="button" class="btn btn-secondary" data-close-modal>Batal</button>
                </div>
            </form>
        </div>
    </div>
</div>
