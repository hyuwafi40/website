{% if tags %}
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                {% for tag in tags %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ tag.name }}</td>
                        <td>
                            <div class="table-actions">
                                <button type="button"
                                        class="btn-icon edit-tag-btn"
                                        data-url="{% url 'core:tag_edit' tag.slug %}"
                                        data-name="{{ tag.name }}"
                                        title="Edit">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button type="button"
                                        class="btn-icon delete-btn"
                                        data-url="{% url 'core:tag_delete' tag.slug %}"
                                        data-title="{{ tag.name }}"
                                        title="Hapus">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% else %}
    <div class="empty-state">
        <i class="fa-solid fa-tag empty-icon"></i>
        <h3 class="empty-title">Belum Ada Tag</h3>
        <p class="empty-desc">Mulai buat tag pertama Anda.</p>
        <button type="button" class="btn btn-primary open-tag-modal">
            <i class="fa-solid fa-plus"></i> Buat Tag
        </button>
    </div>
{% endif %}
