<div class="resource-card">
    <div class="resource-card-header">
        <div class="resource-card-icon">
            <i class="fa-solid fa-upload"></i>
        </div>
        <div>
            <h4 class="resource-card-title">Restore</h4>
            <p class="resource-card-desc">Pulihkan data konten dari file cadangan.</p>
        </div>
    </div>
    <div class="resource-warning">
        <i class="fa-solid fa-circle-exclamation"></i>
        <p>Restore semua model akan menghapus seluruh data konten saat ini dan menggantinya dengan isi file. Pastikan file berasal dari backup sistem ini.</p>
    </div>
    <form method="post"
          action="{% url 'core:resources_restore' %}"
          enctype="multipart/form-data"
          class="resource-form"
          data-resource-form>
        {% csrf_token %}
        <div class="input-group">
            <label>File JSON</label>
            <input type="file" name="file" accept=".json" required class="form-control">
        </div>
        <div class="resource-choice-grid">
            <label class="resource-choice-card active">
                <input type="radio" name="model_label" value="" checked>
                <span>Semua Model Konten</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Category">
                <span>Kategori</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Tag">
                <span>Tag</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Article">
                <span>Artikel</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Album">
                <span>Album</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Photos">
                <span>Foto</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Comment">
                <span>Komentar</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Page">
                <span>Halaman</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Hero">
                <span>Hero</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="blog.Advertisement">
                <span>Iklan</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="core.Brand">
                <span>Brand</span>
            </label>
            <label class="resource-choice-card">
                <input type="radio" name="model_label" value="core.School">
                <span>School</span>
            </label>
        </div>
        <button type="submit" class="btn btn-secondary">
            <i class="fa-solid fa-upload"></i> Restore
        </button>
    </form>
</div>
